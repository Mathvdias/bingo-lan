name: bingo_core
description: "SDK do Bingo: conexão local, regras de jogo, convites e controle de acesso."
version: 0.0.1
homepage:
# SDK privado do app (dependência por path); dependências git são permitidas.
publish_to: 'none'

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.3.0'


dependencies:
  crypto: ^3.0.7
  dart_jsonwebtoken: ^3.3.1
  firebase_remote_config: ^6.1.3
  flutter:
    sdk: flutter
  get_it: ^9.2.0
  lava_flutter:
    git:
      url: https://github.com/Mathvdias/portfolio.git
      path: packages/lava_flutter
      ref: main
  network_info_plus: ^7.0.0
  plugin_platform_interface: ^2.0.2
  purchases_flutter: ^9.10.4
  shelf: ^1.4.2
  shelf_web_socket: ^3.0.0
  uuid: ^4.5.2
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # Ícones Lava (OpenLava: manifest.json + image_1.webp + image_2.webp), um
  # diretório por ícone; o app carrega com a chave
  # `packages/bingo_core/assets/lava/<nome>`. Gerados por tool/lava_icons.py.
  assets:
    - assets/lava/bingo_ball/
    - assets/lava/bingo_cage/
    - assets/lava/camera_scan/
    - assets/lava/info_bubble/
    - assets/lava/premium_badge/
    - assets/lava/trophy/
    - assets/lava/warning_sign/
    - assets/lava/open_book/
    - assets/lava/globe/
    - assets/lava/wifi_table/
    - assets/lava/help_bubble/
    - assets/lava/players/
    - assets/lava/dice/
    - assets/lava/pencil/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
