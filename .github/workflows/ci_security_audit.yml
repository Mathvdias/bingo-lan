name: Dependency audit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub outdated (bingo_app)
        run: |
          cd bingo_app && flutter pub outdated || true
          cd ../bingo_core && flutter pub outdated || true
