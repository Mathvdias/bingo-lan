name: Flutter CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bingo_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get (bingo_core)
        run: flutter pub get
        working-directory: bingo_core

      - name: Test bingo_core
        run: flutter test
        working-directory: bingo_core

      - name: Pub get (bingo_app)
        run: flutter pub get

      - name: Analyze bingo_app
        run: dart analyze lib

      - name: Test bingo_app
        run: flutter test test/
