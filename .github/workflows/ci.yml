name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.38.10

jobs:
  analyze-test:
    name: Análise e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: bingo_core · pub get, analyze, test
        working-directory: bingo_core
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
      - name: bingo_app · pub get, analyze, test
        working-directory: bingo_app
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test

  build-dev-apk:
    name: APK dev (debug)
    # Só em push na main/develop: nos PRs bastam análise e testes
    # (economiza ~7 min de runner).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: bingo_app
        run: |
          flutter pub get
          flutter build apk --debug --flavor dev -t lib/main_dev.dart \
            --dart-define=ENVIRONMENT=dev \
            --dart-define=RC_TEST_STORE_KEY="${{ secrets.RC_TEST_STORE_KEY }}"
      - uses: actions/upload-artifact@v4
        with:
          name: app-dev-debug-${{ github.sha }}
          path: bingo_app/build/app/outputs/flutter-apk/app-dev-debug.apk
          retention-days: 7
