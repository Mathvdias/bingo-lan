name: Flutter CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: bingo_core — pub get + test
        run: |
          cd bingo_core && flutter pub get && flutter test

      - name: bingo_app — pub get + analyze + unit/widget tests
        run: |
          cd bingo_app && flutter pub get && dart analyze lib && flutter test test/
