name: Release Android

# Dispara em tags vX.Y.Z. Gera o App Bundle assinado e, se a service account
# da Play estiver configurada, envia para a trilha INTERNA. A promoção para
# teste fechado e produção continua manual no Play Console.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      track:
        description: Trilha da Play (internal, alpha, beta, production)
        default: internal
        required: true

env:
  FLUTTER_VERSION: 3.38.10
  PACKAGE_NAME: com.nightstudios.bingo

jobs:
  aab:
    name: App Bundle prod
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # `secrets` não pode ser usado em `if`; expomos a presença como env.
      HAS_PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4

      - name: Só libera tag que esteja na main
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags --depth=200 origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::A tag ${GITHUB_REF_NAME} aponta para um commit fora da main; crie a tag a partir da main."; exit 1; }

      - name: Versão a partir da tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            TAG=$(grep '^version:' bingo_app/pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Keystore e key.properties
        working-directory: bingo_app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Secret ANDROID_KEYSTORE_BASE64 ausente"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > app/upload-keystore.jks
          cat > key.properties <<PROPS
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          PROPS

      - name: Checar secrets obrigatórios do build
        env:
          RC_ANDROID_KEY: ${{ secrets.RC_ANDROID_KEY }}
        run: |
          test -n "$RC_ANDROID_KEY" || { echo "::error::Secret RC_ANDROID_KEY vazio: o paywall não funcionaria no build prod"; exit 1; }

      - name: Build AAB (prod, ofuscado)
        working-directory: bingo_app
        run: |
          flutter pub get
          mkdir -p build/symbols
          flutter build appbundle --release --flavor prod -t lib/main.dart \
            --build-name="${{ steps.ver.outputs.name }}" \
            --build-number="${{ steps.ver.outputs.number }}" \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=ENVIRONMENT=prod \
            --dart-define=RC_ANDROID_KEY="${{ secrets.RC_ANDROID_KEY }}" \
            --dart-define=RC_IOS_KEY="${{ secrets.RC_IOS_KEY }}"

      - uses: actions/upload-artifact@v4
        with:
          name: bingo-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.number }}
          path: |
            bingo_app/build/app/outputs/bundle/prodRelease/app-prod-release.aab
            bingo_app/build/app/outputs/mapping/prodRelease/mapping.txt
            bingo_app/build/symbols
          retention-days: 30

      - name: Enviar para a Play (trilha ${{ github.event.inputs.track || 'internal' }})
        if: env.HAS_PLAY_SA == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 -m pip install --quiet --disable-pip-version-check google-auth requests
          python3 .github/scripts/play_upload.py \
            --package "$PACKAGE_NAME" \
            --aab bingo_app/build/app/outputs/bundle/prodRelease/app-prod-release.aab \
            --track "${{ github.event.inputs.track || 'internal' }}" \
            --status completed \
            --mapping bingo_app/build/app/outputs/mapping/prodRelease/mapping.txt \
            --symbols bingo_app/build/symbols \
            --notes-pt "Versão ${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.number }})." \
            --notes-en "Version ${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.number }})."

      - name: Aviso quando não houver service account
        if: env.HAS_PLAY_SA != 'true'
        run: echo "::warning::PLAY_SERVICE_ACCOUNT_JSON não configurado; o AAB ficou só nos artefatos do workflow."
